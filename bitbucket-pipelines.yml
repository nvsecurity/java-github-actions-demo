image: atlassian/default-image:5

pipelines:
  default:
    - step:
        name: NightVision scan
        services:
          - docker
        max-time: 60
        script:
          - curl -L https://downloads.nightvision.net/binaries/latest/nightvision_latest_linux_amd64.tar.gz -q | tar -xz
          - mv nightvision /usr/local/bin/
          - nightvision openapi extract . --target javaspringvulny-api --project my-project --lang java
          - docker-compose up -d
          - sleep 15
          - nightvision scan javaspringvulny-api --project my-project --auth javaspringvulny-api > scan-results.txt
          - nightvision export sarif -s "$(head -n 1 scan-results.txt)" --openapi-file openapi-spec.yml
        artifacts:
          - results.sarif
          - openapi-spec.yml
