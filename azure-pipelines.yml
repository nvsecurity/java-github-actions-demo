trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  NIGHTVISION_TARGET: javaspringvulny-api
  NIGHTVISION_PROJECT: my-project
  NIGHTVISION_AUTH: javaspringvulny-api
  TARGET_URL: https://localhost:9000

steps:
  - checkout: self

  - script: |
      curl -L https://downloads.nightvision.net/binaries/latest/nightvision_latest_linux_amd64.tar.gz -q | tar -xz
      sudo mv nightvision /usr/local/bin/
    displayName: Install the NightVision CLI

  - script: nightvision openapi extract . --target "$NIGHTVISION_TARGET" --project "$NIGHTVISION_PROJECT" --lang java
    displayName: Extract the API specification from the code
    env:
      NIGHTVISION_TOKEN: $(NIGHTVISION_TOKEN)

  - script: |
      docker compose up -d
      curl --retry 30 --retry-all-errors --retry-delay 2 --fail -k -s -o /dev/null "$TARGET_URL"
    displayName: Start the application

  - script: |
      nightvision scan "$NIGHTVISION_TARGET" --project "$NIGHTVISION_PROJECT" --auth "$NIGHTVISION_AUTH" > scan-results.txt
      nightvision export sarif -s "$(head -n 1 scan-results.txt)" --openapi-file openapi-spec.yml
    displayName: Scan the API
    env:
      NIGHTVISION_TOKEN: $(NIGHTVISION_TOKEN)

  - publish: results.sarif
    artifact: CodeAnalysisLogs
    displayName: Publish the SARIF results
