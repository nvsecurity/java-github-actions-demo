name: NightVision scan

on:
  push:
  workflow_dispatch:

env:
  NIGHTVISION_TOKEN: ${{ secrets.NIGHTVISION_TOKEN }}
  NIGHTVISION_TARGET: javaspringvulny-api
  NIGHTVISION_PROJECT: my-project
  NIGHTVISION_AUTH: javaspringvulny-api

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Install the NightVision CLI
        run: |
          curl -L https://downloads.nightvision.net/binaries/latest/nightvision_latest_linux_amd64.tar.gz -q | tar -xz
          sudo mv nightvision /usr/local/bin/

      - name: Extract the API specification from the code
        run: nightvision openapi extract . --target "$NIGHTVISION_TARGET" --project "$NIGHTVISION_PROJECT" --lang java

      - name: Start the application
        run: |
          docker compose up -d
          curl --retry 30 --retry-all-errors --retry-delay 2 --fail -k -s -o /dev/null https://localhost:9000

      - name: Scan the API
        run: |
          nightvision scan "$NIGHTVISION_TARGET" --project "$NIGHTVISION_PROJECT" --auth "$NIGHTVISION_AUTH" > scan-results.txt
          nightvision export sarif -s "$(head -n 1 scan-results.txt)" --openapi-file openapi-spec.yml

      - name: Upload the findings to GitHub code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
