stages:
  - extract
  - scan

variables:
  NIGHTVISION_TARGET: javaspringvulny-api
  NIGHTVISION_PROJECT: my-project
  NIGHTVISION_AUTH: javaspringvulny-api
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "/certs/client"
  FF_NETWORK_PER_BUILD: "true"

# Scan on the default branch, on merge requests and on manual runs, not on
# every feature push.
workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"

.install_nightvision: &install_nightvision
  - apt-get update && apt-get install -y curl ca-certificates
  - curl -L https://downloads.nightvision.net/binaries/latest/nightvision_latest_linux_amd64.tar.gz -q | tar -xz
  - mv nightvision /usr/local/bin/

extract_spec:
  stage: extract
  image: ubuntu:24.04
  before_script:
    - *install_nightvision
  script:
    - nightvision openapi extract . --target "$NIGHTVISION_TARGET" --project "$NIGHTVISION_PROJECT" --lang java
  artifacts:
    paths:
      - openapi-spec.yml
    expire_in: 30 days

dast_scan:
  stage: scan
  image: ubuntu:24.04
  services:
    - docker:dind
  needs:
    - extract_spec
  before_script:
    - *install_nightvision
    - apt-get install -y docker.io docker-compose-v2
  script:
    - docker compose up -d
    - sleep 15
    - nightvision scan "$NIGHTVISION_TARGET" --project "$NIGHTVISION_PROJECT" --auth "$NIGHTVISION_AUTH" > scan-results.txt
    - SCAN_ID=$(head -n 1 scan-results.txt)
    - 'test -n "$SCAN_ID" || { echo "No scan ID in the scan output" >&2; exit 1; }'
    - nightvision export gitlab -s "$SCAN_ID" --openapi-file openapi-spec.yml
  artifacts:
    reports:
      dast: gl-dast-report.json
    paths:
      - gl-dast-report.json
    expire_in: 30 days
